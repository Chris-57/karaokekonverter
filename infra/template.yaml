  OperationalFailuresQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}/operational-failures
      LogGroupNames:
      - Ref: ApiLogs
      - Ref: WorkerLogs
      QueryString: 'fields @timestamp, component, event, source, jobId, requestId, messageId, code, errorType, status
  
        | filter operationalFailure = 1
  
        | sort @timestamp desc
  
        | limit 100'
  ConversionOutcomesQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}/conversion-outcomes
      LogGroupNames:
      - Ref: WorkerLogs
      QueryString: 'filter outcome = 1
  
        | stats sum(completedJobs) as complete, sum(partialJobs) as partial, sum(failedJobs) as failed, sum(operationalFailure)
        as operational, avg(elapsedMs) as averageMs by source'
  JobTraceQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}/job-trace
      LogGroupNames:
      - Ref: ApiLogs
      - Ref: WorkerLogs
      QueryString: 'fields @timestamp, event, jobId, requestId, messageId, source, stage, code, elapsedMs, queueWaitMs,
        receiveCount
  
        | filter ispresent(jobId)
  
        | sort @timestamp desc
  
        | limit 200'

Outputs:
  ApiAccessLogGroup: {Value: !Ref ApiAccessLogs}
  WebsiteUrl: {Value: !Sub 'https://${Website.DomainName}'}
  WebsiteBucket: {Value: !Ref WebsiteBucket}
  DistributionId: {Value: !Ref Website}
  ApiUrl: {Value: !GetAtt HttpApi.ApiEndpoint}
  ConfigurationSecretArn: {Value: !Ref AppConfig}
  JobsTableName: {Value: !Ref JobsTable}
  WorkerLogGroup: {Value: !Ref WorkerLogs}
  AlertTopicArn: {Value: !Ref AlertTopic}
  MonitoringDashboardName:
    Value:
      Ref: MonitoringDashboard
  MonitoringDashboardUrl:
    Value:
      Fn::Sub: https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${MonitoringDashboard}
  MonitoringNamespace:
    Value:
      Fn::Sub: KaraokeKonverter/${AWS::StackName}
  MonitoringFunctionName:
    Value:
      Ref: AvailabilityFunction
  MonitoringLogGroup:
    Value:
      Ref: AvailabilityLogs
  MonitoringTestAlarmName:
    Value:
      Ref: MonitoringTestAlarm
  MonitoringAlarmNames:
    Value:
      Fn::Join:
      - ','
      - - Ref: DeadLetterAlarm
        - Ref: WorkerErrorsAlarm
        - Ref: ApiErrorsAlarm
        - Ref: ApiServerErrorsAlarm
        - Ref: LambdaThrottlesAlarm
        - Ref: QueueAgeAlarm
        - Ref: DatabaseThrottlesAlarm
        - Ref: OperationalFailuresAlarm
        - Ref: AvailabilityAlarm
        - Ref: MonitoringTestAlarm
  ApiLogGroup:
    Value:
      Ref: ApiLogs
  JobsQueueUrl:
    Value:
      Ref: JobsQueue
  DeadLetterQueueUrl:
    Value:
      Ref: DeadLetterQueue
