name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SAM_CLI_TELEMETRY: '0'
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_DEFAULT_REGION: us-east-2
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Check public repository contents
        run: npm run check:public
      - name: Install application dependencies
        run: npm ci
      - name: Run JavaScript tests
        run: npm test
      - name: Run Python monitoring tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check source syntax
        run: npm run check
      - name: Install SAM validation tools
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Validate AWS infrastructure
        run: sam validate --lint --template-file infra/template.yaml --region us-east-2
      - name: Build Lambda artifacts
        run: sam build --template-file infra/template.yaml
      - name: Check packaged entry points
        run: node scripts/check-build.mjs

# AWS deployment is intentionally configured in a subsequent change after the
# repository and its first CI run exist. This workflow has no AWS credentials,
# deployment role, id-token permission, live provider requests or deploy command.
