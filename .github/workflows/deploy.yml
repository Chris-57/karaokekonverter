name: Deploy AWS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Deploy current main or restore a saved verified release
        type: choice
        options: [deploy, restore]
        default: deploy
        required: true
      release_id:
        description: For restore only, e.g. run-123456789-1 or snapshot-123456789-1
        type: string
        default: ''
        required: false

permissions:
  contents: read

# A running CloudFormation update must finish. Do not cancel it for a newer push.
concurrency:
  group: karaokekonverter-dev-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify existing AWS app
    if: >-
      vars.AWS_DEPLOY_ENABLED == 'true' &&
      github.repository == 'Chris-57/karaokekonverter' &&
      github.repository_id == '1361537293' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch') ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.id == 1361537293))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      SAM_CLI_TELEMETRY: '0'
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_DEFAULT_REGION: us-east-2
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Validate event identity and current main
        id: selection
        run: python3 -m scripts.delivery_event
      - name: Set up Node.js
        if: steps.selection.outputs.ready == 'true' && steps.selection.outputs.mode == 'deploy'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Set up Python
        if: steps.selection.outputs.ready == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Check public repository contents
        if: steps.selection.outputs.ready == 'true' && steps.selection.outputs.mode == 'deploy'
        run: npm run check:public
      - name: Install application dependencies
        if: steps.selection.outputs.ready == 'true' && steps.selection.outputs.mode == 'deploy'
        run: npm ci
      - name: Run JavaScript tests
        if: steps.selection.outputs.ready == 'true' && steps.selection.outputs.mode == 'deploy'
        run: npm test
      - name: Run Python tests
        if: steps.selection.outputs.ready == 'true'
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check source syntax
        if: steps.selection.outputs.ready == 'true' && steps.selection.outputs.mode == 'deploy'
        run: npm run check
      - name: Install SAM validation tools
        if: steps.selection.outputs.ready == 'true' && steps.selection.outputs.mode == 'deploy'
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Validate AWS infrastructure
        if: steps.selection.outputs.ready == 'true' && steps.selection.outputs.mode == 'deploy'
        run: sam validate --lint --template-file infra/template.yaml --region us-east-2
      - name: Validate delivery bootstrap template
        if: steps.selection.outputs.ready == 'true' && steps.selection.outputs.mode == 'deploy'
        run: python -m scripts.check_delivery_template
      - name: Build Lambda artifacts
        if: steps.selection.outputs.ready == 'true' && steps.selection.outputs.mode == 'deploy'
        run: sam build --template-file infra/template.yaml
      - name: Check packaged entry points
        if: steps.selection.outputs.ready == 'true' && steps.selection.outputs.mode == 'deploy'
        run: node scripts/check-build.mjs
      - name: Recheck main before AWS credentials
        if: steps.selection.outputs.ready == 'true'
        id: fresh
        run: python -m scripts.delivery_event
      - name: Obtain temporary AWS credentials
        if: steps.fresh.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-region: us-east-2
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: karaoke-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 7200
          mask-aws-account-id: true
          unset-current-credentials: true
      - name: Deploy or restore, publish and verify
        if: steps.fresh.outputs.ready == 'true'
        run: python -m scripts.deploy_aws

# No environment: adding one changes the OIDC subject and requires new IAM trust.
# No PR trigger, static AWS keys, application secrets, cache restores or public build artifacts.
